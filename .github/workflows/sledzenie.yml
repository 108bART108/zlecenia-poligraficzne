name: Śledzenie przesyłek

on:
  schedule:
    - cron: "*/30 * * * *"     # co 30 minut (GitHub bywa spóźniony o kilka–kilkanaście minut)
  workflow_dispatch:            # przycisk „Run workflow” do ręcznego uruchomienia
    inputs:
      tryb:
        description: "Wpisz 'test', aby wysłać próbne powiadomienie"
        required: false
        default: ""

jobs:
  sledz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install firebase-admin requests
      - run: python bot/sledzenie_chmura.py "$TRYB"
        env:
          TRYB: ${{ github.event.inputs.tryb }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DHL_API_KEY: ${{ secrets.DHL_API_KEY }}
          GLS_API_KEY: ${{ secrets.GLS_API_KEY }}
          FIREBASE_SA_PANEL: ${{ secrets.FIREBASE_SA_PANEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
